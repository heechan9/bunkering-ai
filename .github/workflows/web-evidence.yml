name: Web evidence consistency
on:
  pull_request:
    paths: ['web/**', 'results/diagnostics/review_4seed/**', 'scripts/audit_web_evidence.py', 'tests/test_web_evidence.py', '.github/workflows/web-evidence.yml']
  push:
    branches: [main]
    paths: ['web/**', 'results/diagnostics/review_4seed/**', 'scripts/audit_web_evidence.py', 'tests/test_web_evidence.py', '.github/workflows/web-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit_web_evidence.py
      - run: python -m unittest discover -s tests -p test_web_evidence.py -v
