name: Web evidence consistency
on:
  pull_request:
    paths: ['scripts/compare_ab_log.py', 'tests/test_ab_log_comparison.py', 'results/real_voyage/**', 'scripts/review_ab_log.py', 'tests/test_ab_log.py', 'web/**', 'data/public/**', 'docs/data/source_baseline.json', 'scripts/source_changes.py', 'results/diagnostics/review_4seed/**', 'scripts/audit_web_evidence.py', 'scripts/build_web_summary.py', 'tests/test_web_evidence.py', '.github/workflows/web-evidence.yml']
  push:
    branches: [main]
    paths: ['scripts/compare_ab_log.py', 'tests/test_ab_log_comparison.py', 'results/real_voyage/**', 'scripts/review_ab_log.py', 'tests/test_ab_log.py', 'web/**', 'data/public/**', 'docs/data/source_baseline.json', 'scripts/source_changes.py', 'results/diagnostics/review_4seed/**', 'scripts/audit_web_evidence.py', 'scripts/build_web_summary.py', 'tests/test_web_evidence.py', '.github/workflows/web-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p "test_ab_log*.py" -v
      - run: python -m scripts.compare_ab_log --check
      - run: python scripts/audit_web_evidence.py
      - run: python -m unittest discover -s tests -p test_web_evidence.py -v
      - run: python -m scripts.build_web_summary --check
      - run: python scripts/source_changes.py data/public docs/data/source_baseline.json
