name: Python regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.12, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            .github/workflows/python-tests.yml
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Record environment
        run: |
          mkdir -p test-results
          python --version > test-results/environment.txt
          python -m pip freeze >> test-results/environment.txt
      - name: Run all Python tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
