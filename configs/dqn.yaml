env:
  n_ports: 3
  max_steps: 30
  min_safe_fuel: 0.15

network:
  hidden_dims: [128, 128]

train:
  learning_rate: 0.0001
  gamma: 0.99
  batch_size: 64
  replay_buffer_size: 100000
  target_update_freq: 1000
  n_episodes: 5000

exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 100000
